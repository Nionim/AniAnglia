name: CMake build

on:
  workflow_dispatch:
      inputs:
        version_short:
          description: 'Version'
          required: true
          default: 'v0.0.0-dev'
          type: string
        version_build:
          description: 'Build number'
          required: true
          default: '1'
          type: string
        bundle_id:
          description: 'Group'
          required: true
          type: choice
          options:
            - 'delta.cion.anisaturn'
            - 'delta.cion.anisaturnbeta'
          default: 'delta.cion.anisaturnbeta'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Commit
        id: version
        run: |
          COMMIT_HASH=$(git rev-parse --short=8 HEAD)
          echo "commit_hash=$COMMIT_HASH" >> $GITHUB_OUTPUT

          if [[ "${{ github.event.inputs.bundle_id }}" == *"beta"* ]]; then
            VERSION="${{ github.event.inputs.version_short }}_($COMMIT_HASH)"
          else
            VERSION="${{ github.event.inputs.version_short }}"
          fi
          echo "final_version=$VERSION" >> $GITHUB_OUTPUT
          echo "Project version: $VERSION"

      - name: Install CMake
        run: brew install cmake

      - name: Configure with CMake
        run: |
          cmake -G Xcode \
          -B build \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DVER_SHORT="${{ steps.version.outputs.final_version }}" \
          -DVER_BUILD="${{ github.event.inputs.version_build }}" \
          -DBUNDLE_ID="${{ github.event.inputs.bundle_id }}"

      - name: Build .app
        run: |
          xcodebuild -project build/AniSaturn.xcodeproj \
            -scheme AniSaturn \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build_derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            PRODUCT_BUNDLE_IDENTIFIER="${{ github.event.inputs.bundle_id }}"

      - name: Locate .app
        id: locate
        run: |
          APP_PATH=$(find build/Release-iphoneos -name "*.app" -type d | head -n 1)
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "${{ steps.locate.outputs.app_path }}" Payload/
          zip -r AniSaturn.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AniSaturn.ipa
          path: AniSaturn.ipa
          retention-days: 7
